name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared packages
        run: npm run build -w @trillion/shared && npm run build -w @trillion/ai-providers
      - name: Typecheck + build API
        run: node_modules/.bin/tsc --noEmit -p services/api && npm run build -w @trillion/api
      - name: Typecheck mobile
        run: node_modules/.bin/tsc --noEmit -p apps/mobile
