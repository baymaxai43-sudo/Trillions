name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build -w @trillion/shared -w @trillion/ai-providers
      - run: npm run typecheck -w @trillion/shared -w @trillion/ai-providers -w @trillion/api
