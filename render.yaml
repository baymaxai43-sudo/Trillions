# Render Blueprint: TRILLION API on the free plan, Frankfurt (next to Supabase eu-central-1).
# Secrets are marked sync:false and set in the Render dashboard, never committed.
services:
  - type: web
    name: trillion-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build -w @trillion/shared && npm run build -w @trillion/ai-providers && npm run build -w @trillion/api
    startCommand: npm run start -w @trillion/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: OPENROUTER_API_KEYS
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: CONNECTOR_ENC_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VERCEL_CLIENT_ID
        sync: false
      - key: VERCEL_CLIENT_SECRET
        sync: false
      - key: VERCEL_INTEGRATION_SLUG
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: API_PUBLIC_URL
        value: https://trillion-api.onrender.com
      - key: AGENT_ENABLE_CODE
        value: "false"
      - key: CORS_ORIGINS
        value: ""
